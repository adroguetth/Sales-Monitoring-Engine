name: Event Date Fetcher

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (e.g., 2026)'
        required: true
        default: '2026'
      force_refresh:
        description: 'Ignore cache and re‑fetch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to avoid shallow errors on push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 openai

      - name: Run fetcher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/1_1.event_date_fetcher.py \
            --year ${{ github.event.inputs.year }} \
            ${{ github.event.inputs.force_refresh == 'true' && '--force-refresh' || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event_date/event_dated.json
          git diff --staged --quiet || git commit -m "Update event dates for ${{ github.event.inputs.year }}"
          git push
