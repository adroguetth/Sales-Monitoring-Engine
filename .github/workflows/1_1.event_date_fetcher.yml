# .github/workflows/event_date_fetcher.yml
name: Event Date Fetcher

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (e.g., 2026)'
        required: true
        default: '2026'
        type: string
      force_refresh:
        description: 'Ignore cache and re‑fetch all data'
        required: false
        default: false
        type: boolean

jobs:
  fetch-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 openai
      - name: Run fetcher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/1_1.event_date_fetcher.py \
            --year ${{ github.event.inputs.year }} \
            ${{ github.event.inputs.force_refresh == 'true' && '--force-refresh' || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-dates-${{ github.run_id }}
          path: data/event_date/event_dates.json
          retention-days: 7
