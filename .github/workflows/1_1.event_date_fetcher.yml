# .github/workflows/test_event_fetcher.yml
# Manual workflow to test event_date_fetcher.py with weighted multi-source scraping
# Trigger: workflow_dispatch only (no cron)

name: Test Event Date Fetcher

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (e.g., 2026)'
        required: true
        default: '2026'
        type: string
      output_file:
        description: 'Output JSON filename'
        required: false
        default: 'event_dates.json'
        type: string
      force_refresh:
        description: 'Ignore cache and re-scrape all sources'
        required: false
        default: false
        type: boolean
      log_level:
        description: 'Logging level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR

permissions:
  contents: read

jobs:
  test-fetcher:
    name: Run Event Date Fetcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai urllib3

      - name: Run event date fetcher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          SCRIPT="scripts/1_1.event_date_fetcher.py"
          YEAR="${{ github.event.inputs.year }}"
          OUTPUT="${{ github.event.inputs.output_file }}"
          FORCE="${{ github.event.inputs.force_refresh }}"
          LOG_LEVEL="${{ github.event.inputs.log_level }}"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ Script not found: $SCRIPT"
            echo "Current directory structure:"
            ls -la
            ls -la scripts/ 2>/dev/null || echo "scripts/ directory not found"
            exit 1
          fi

          echo "============================================"
          echo "Event Date Fetcher - Smart Weighted Scraping"
          echo "============================================"
          echo "Year: $YEAR"
          echo "Output: $OUTPUT"
          echo "Force refresh: $FORCE"
          echo "Log level: $LOG_LEVEL"
          echo "DeepSeek API: ${{ secrets.DEEPSEEK_API_KEY != '' && 'configured' || 'not configured' }}"
          echo "============================================"

          CMD="python $SCRIPT --year $YEAR --output $OUTPUT --log-level $LOG_LEVEL"

          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force-refresh"
          fi

          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "✅ DeepSeek API key found - arbitration mode enabled"
            CMD="$CMD --deepseek-key $DEEPSEEK_API_KEY"
          else
            echo "⚠️ No DeepSeek API key - using scraping + historical only"
          fi

          echo "Executing: $CMD"
          eval $CMD

          # Verify output file
          if [ -f "$OUTPUT" ]; then
            echo "✅ Output file created: $OUTPUT"
            echo "File size: $(du -h $OUTPUT | cut -f1)"
          else
            echo "❌ Output file not created"
            exit 1
          fi

      - name: Display results
        run: |
          OUTPUT="${{ github.event.inputs.output_file }}"
          echo "============================================"
          echo "EXTRACTED EVENT DATES"
          echo "============================================"
          if [ -f "$OUTPUT" ]; then
            cat "$OUTPUT" | python -m json.tool
          else
            echo "No output file found"
          fi

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-dates-${{ github.run_id }}
          path: ${{ github.event.inputs.output_file }}
          retention-days: 30
