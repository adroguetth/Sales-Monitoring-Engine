# .github/workflows/event_date_fetcher.yml
# Manual workflow to fetch Chilean e‑commerce event dates (CyberDay, CyberMonday, BlackFriday)
# Uses intelligent nearest‑event logic and local cache to avoid redundant API calls.

name: 1_1. Event Date Fetcher

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (e.g., 2026)'
        required: true
        default: '2026'
        type: string
      force_refresh:
        description: 'Ignore cache and re‑fetch all data'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fetch-dates:
    name: Fetch Event Dates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai

      - name: Run event date fetcher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          YEAR="${{ github.event.inputs.year }}"
          FORCE="${{ github.event.inputs.force_refresh }}"

          # Build command
          CMD="python scripts/1_1.event_date_fetcher.py --year $YEAR"

          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force-refresh"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Upload event dates artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-dates-${{ github.run_id }}
          path: data/event_date/event_dates.json
          retention-days: 7
          if-no-files-found: error
