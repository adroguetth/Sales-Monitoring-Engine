# .github/workflows/manual_sales_generation.yml
# Sales Monitoring Engine - Manual Workflow
# Trigger: manual dispatch only (workflow_dispatch)
# Script location: scripts/sales_generator.py

name: Sales Monitoring Engine - Manual Generation

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD) - Leave empty for yesterday'
        required: false
        type: string
        default: ''
      days_to_generate:
        description: 'Number of days to generate (1-30)'
        required: false
        type: number
        default: 1
      database_name:
        description: 'Database file name'
        required: false
        type: string
        default: 'sales_monitoring.db'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-sales-data:
    name: Generate Sales Data
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Verify script exists in scripts folder
      - name: Verify script location
        run: |
          if [ -f "scripts/sales_generator.py" ]; then
            echo "✅ Script found: scripts/sales_generator.py"
            ls -la scripts/
          else
            echo "❌ ERROR: scripts/sales_generator.py not found"
            echo "Current directory structure:"
            ls -la
            if [ -d "scripts" ]; then
              ls -la scripts/
            fi
            exit 1
          fi
      
      # Step 3: Setup Python environment
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # Step 4: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 5: Verify DeepSeek API key exists
      - name: Verify DeepSeek API configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "⚠️ WARNING: DEEPSEEK_API_KEY not found in secrets."
            echo "Running in OFFLINE mode (no AI pattern recognition)."
            echo "To enable intelligent generation, add DEEPSEEK_API_KEY to repository secrets."
          else
            echo "✅ DeepSeek API key found - Intelligent mode ACTIVE"
          fi
      
      # Step 6: Generate sales data
      - name: Generate sales data
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          DAYS="${{ github.event.inputs.days_to_generate }}"
          DB_NAME="${{ github.event.inputs.database_name }}"
          
          echo "============================================"
          echo "Sales Monitoring Engine - Data Generation"
          echo "============================================"
          echo "Script: scripts/sales_generator.py"
          echo "Target date: ${TARGET_DATE:-yesterday}"
          echo "Days to generate: $DAYS"
          echo "Database: $DB_NAME"
          echo "============================================"
          
          # Make script executable
          chmod +x scripts/sales_generator.py
          
          # Calculate start date
          if [ -z "$TARGET_DATE" ]; then
            START_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          else
            START_DATE="$TARGET_DATE"
          fi
          
          # Run generation for all requested days (always use loop to avoid duplicate on day 1)
          echo "Generating $DAYS day(s) of data starting from $START_DATE..."
          for i in $(seq 0 $((DAYS - 1))); do
            CURRENT_DATE=$(date -d "$START_DATE - ${i} days" +%Y-%m-%d)
            echo "Processing: $CURRENT_DATE"
            python scripts/sales_generator.py --date "$CURRENT_DATE" --db "$DB_NAME"
          done
          
          # Get database size and record count
          if [ -f "$DB_NAME" ]; then
            DB_SIZE=$(du -h "$DB_NAME" | cut -f1)
            echo "db_size=$DB_SIZE" >> $GITHUB_OUTPUT
            
            # Count records (heredoc avoids YAML indentation causing Python IndentationError)
            python -c "
import sqlite3
try:
    conn = sqlite3.connect('$DB_NAME')
    cursor = conn.cursor()
    cursor.execute('SELECT COUNT(*) FROM sales_data')
    count = cursor.fetchone()[0]
    print(f'record_count={count}')
    conn.close()
except Exception as e:
    print(f'record_count=0')
    print(f'Error: {e}')
" >> $GITHUB_OUTPUT
          else
            echo "db_size=0" >> $GITHUB_OUTPUT
            echo "record_count=0" >> $GITHUB_OUTPUT
            echo "❌ Database file not created"
            exit 1
          fi
      
      # Step 7: Upload database as artifact
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-${{ github.run_id }}
          path: ${{ github.event.inputs.database_name }}
          retention-days: 30
          compression-level: 6
      
      # Step 8: Generate data summary
      - name: Generate data summary
        if: always()
        run: |
          DB_NAME="${{ github.event.inputs.database_name }}"
          
          echo "============================================"
          echo "DATA GENERATION SUMMARY"
          echo "============================================"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Date: $(date)"
          echo ""
          echo "Script location: scripts/sales_generator.py"
          echo "Database: $DB_NAME"
          echo "Size: ${{ steps.generate.outputs.db_size }}"
          echo "Records: ${{ steps.generate.outputs.record_count }}"
          echo ""
          
          # Display sample data if available
          RECORD_COUNT="${{ steps.generate.outputs.record_count }}"
          if [ -f "$DB_NAME" ] && [ "${RECORD_COUNT:-0}" -gt 0 ]; then
            echo "📊 SAMPLE DATA (last 10 records):"
            echo "----------------------------------------"
            python -c "
import sqlite3
import pandas as pd
conn = sqlite3.connect('$DB_NAME')
df = pd.read_sql_query('''
    SELECT date, store_id, product_id, units_sold, revenue,
           promotion_flag, stockout_flag
    FROM sales_data
    ORDER BY date DESC, store_id, product_id
    LIMIT 10
''', conn)
print(df.to_string(index=False))
conn.close()
"
            echo ""
            echo "----------------------------------------"
            echo ""
            echo "📊 SUMMARY BY STORE:"
            python -c "
import sqlite3
conn = sqlite3.connect('$DB_NAME')
cursor = conn.cursor()
cursor.execute('''
    SELECT store_id,
           COUNT(*) as transactions,
           SUM(units_sold) as total_units,
           SUM(revenue) as total_revenue,
           SUM(CASE WHEN promotion_flag=1 THEN 1 ELSE 0 END) as promos
    FROM sales_data
    GROUP BY store_id
    ORDER BY store_id
''')
results = cursor.fetchall()
print(f\"{'Store':<6} {'Transactions':<14} {'Total Units':<12} {'Total Revenue':<15} {'Promos':<8}\")
print(\"-\" * 60)
for row in results:
    print(f\"{row[0]:<6} {row[1]:<14} {row[2]:<12} {row[3]:<15.2f} {row[4]:<8}\")
conn.close()
"
            echo ""
            echo "✅ Artifact available for download: sales-data-${{ github.run_id }}"
          else
            echo "❌ Database file not found or empty"
          fi
          echo "============================================"
      
      # Step 9: Success notification
      - name: Completion status
        if: success()
        run: |
          echo "✅ Sales data generation completed successfully!"
          echo "📥 Download the artifact: sales-data-${{ github.run_id }}"
          echo ""
          echo "To query the database:"
          echo "  sqlite3 ${{ github.event.inputs.database_name }} \"SELECT * FROM sales_data LIMIT 5;\""
      
      # Step 10: Failure notification
      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Sales data generation failed!"
          echo "Check the logs above for details."
          echo ""
          echo "Common issues:"
          echo "  1. Script not found in scripts/sales_generator.py"
          echo "  2. Missing Python dependencies"
          echo "  3. Database write permissions"
          echo "  4. Invalid date format"
