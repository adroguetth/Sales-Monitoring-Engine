name: Manual Sales Data Generator (Test)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha objetivo (YYYY-MM-DD) - Dejar vacío para usar ayer'
        required: false
        type: string
        default: ''
      commit_message:
        description: 'Mensaje de commit personalizado (opcional)'
        required: false
        type: string
        default: ''

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openai

      - name: Run sales generator (test mode)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd scripts
          if [ -z "${{ github.event.inputs.target_date }}" ]; then
            python 1_sales_generator.py
          else
            python 1_sales_generator.py --date ${{ github.event.inputs.target_date }}
          fi

      - name: Commit and push generated database
        run: |
          # Configure git user (GitHub Actions bot)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all new/modified database files (data/sales/*.db)
          git add data/sales/*.db
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new database files to commit."
          else
            # Set commit message
            if [ -n "${{ github.event.inputs.commit_message }}" ]; then
              COMMIT_MSG="${{ github.event.inputs.commit_message }}"
            else
              # Extract date from the most recent .db file
              LATEST_DB=$(ls -t data/sales/*.db 2>/dev/null | head -1)
              if [ -n "$LATEST_DB" ]; then
                DB_DATE=$(basename "$LATEST_DB" | sed 's/sales_\(.*\)\.db/\1/')
                COMMIT_MSG="Add sales data for $DB_DATE"
              else
                COMMIT_MSG="Update sales databases"
              fi
            fi
            git commit -m "$COMMIT_MSG"
            git push
            echo "Committed and pushed successfully."
          fi
