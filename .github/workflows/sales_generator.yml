name: Generate Sales Data (Manual)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha objetivo (YYYY-MM-DD) - Dejar vacío para usar ayer'
        required: false
        type: string
        default: ''
      db_file:
        description: 'Nombre del archivo de base de datos SQLite'
        required: false
        type: string
        default: 'sales_monitoring.db'

jobs:
  generate-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openai

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # Cambiar al directorio donde está el script (ajusta si es necesario)
          cd scripts
          
          # Construir comando: si se proporciona fecha, la agrega
          CMD="python 1_sales_generator.py --db ${{ github.event.inputs.db_file }}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            CMD="$CMD --date ${{ github.event.inputs.target_date }}"
          fi
          echo "Ejecutando: $CMD"
          eval $CMD

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-db
          path: scripts/${{ github.event.inputs.db_file }}
          retention-days: 7
