# .github/workflows/sales_generator.yml
name: Sales Data Generator

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 06:00 UTC
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha objetivo (YYYY-MM-DD). Vacío = ayer'
        required: false
        type: string
      force_refresh:
        description: 'Ignorar caché y regenerar'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # Necesario para hacer push al repositorio

jobs:
  generate-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Para evitar conflictos en push

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas numpy openai

      - name: Determinar fecha y ruta
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          fi
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "db_file=data/sales/${TARGET_DATE}.db" >> $GITHUB_OUTPUT
          mkdir -p data/sales

      - name: Ejecutar generador de ventas
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/1_2.sales_generator.py \
            --date ${{ steps.date.outputs.target_date }} \
            --db ${{ steps.date.outputs.db_file }}

      - name: Verificar contenido de la base de datos
        run: |
          echo "Archivo: ${{ steps.date.outputs.db_file }}"
          ls -la ${{ steps.date.outputs.db_file }}
          echo "Registros:"
          sqlite3 ${{ steps.date.outputs.db_file }} "SELECT COUNT(*) FROM sales_data;"

      - name: Commit y push al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.date.outputs.db_file }}
          git diff --staged --quiet || git commit -m "Actualizar ventas para ${{ steps.date.outputs.target_date }}"
          git push
