# .github/workflows/sales_generator.yml
# Daily sales data generation with output in data/sales/

name: Sales Data Generator

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        type: string
        default: ''
      db_name:
        description: 'Output database file name'
        required: false
        type: string
        default: 'sales_monitoring.db'

permissions:
  contents: read

jobs:
  generate-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy openai

      - name: Create data/sales directory
        run: mkdir -p data/sales

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          DB_NAME="${{ github.event.inputs.db_name }}"
          DB_PATH="data/sales/${DB_NAME}"

          CMD="python scripts/1_2.sales_generator.py --db $DB_PATH"
          if [ -n "$TARGET_DATE" ]; then
            CMD="$CMD --date $TARGET_DATE"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: List generated files
        run: ls -la data/sales/

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-${{ github.run_id }}
          path: data/sales/${{ github.event.inputs.db_name || 'sales_monitoring.db' }}
          retention-days: 30   # longer retention for historical data
