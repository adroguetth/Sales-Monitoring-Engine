name: Manual Sales Data Generator (Test)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha objetivo (YYYY-MM-DD) - Dejar vacío para usar ayer'
        required: false
        type: string
        default: ''
      commit_message:
        description: 'Mensaje de commit personalizado (opcional)'
        required: false
        type: string
        default: ''

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openai

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${{ github.event.inputs.target_date }}" ]; then
            python scripts/1_sales_generator.py
          else
            python scripts/1_sales_generator.py --date ${{ github.event.inputs.target_date }}
          fi

      - name: Commit and push generated databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all database files (sales, stores, products)
          git add data/sales/*.db data/stores/*.db data/products/*.db || true
          
          if git diff --staged --quiet; then
            echo "No new database files to commit."
          else
            if [ -n "${{ github.event.inputs.commit_message }}" ]; then
              COMMIT_MSG="${{ github.event.inputs.commit_message }}"
            else
              LATEST_DB=$(ls -t data/sales/*.db 2>/dev/null | head -1)
              if [ -n "$LATEST_DB" ]; then
                DB_DATE=$(basename "$LATEST_DB" | sed 's/sales_\(.*\)\.db/\1/')
                COMMIT_MSG="Add sales data for $DB_DATE"
              else
                COMMIT_MSG="Update sales databases"
              fi
            fi
            git commit -m "$COMMIT_MSG"
            git push
            echo "Committed and pushed successfully."
          fi
