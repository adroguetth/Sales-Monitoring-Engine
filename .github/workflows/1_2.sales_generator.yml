# .github/workflows/sales_generator.yml
# Genera la base de datos de ventas diaria y la guarda en data/sales/ del repo

name: Sales Data Generator

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 06:00 UTC
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha objetivo (YYYY-MM-DD). Vacío = ayer'
        required: false
        type: string

permissions:
  contents: write   # ← Cambiado de 'read' a 'write' para poder hacer push

jobs:
  generate-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy openai

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          fi
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/1_2.sales_generator.py --date ${{ steps.date.outputs.target_date }}

      - name: Commit and push database to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sales/${{ steps.date.outputs.target_date }}.db
          git diff --cached --quiet || git commit -m "chore: add sales data for ${{ steps.date.outputs.target_date }}"
          git push
