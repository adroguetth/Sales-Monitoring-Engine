# .github/workflows/sales_generator.yml
# Daily sales data generation using 1_2.sales_generator.py

name: Sales Data Generator

on:
  schedule:
    # Run daily at 06:00 UTC (adjust as needed)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        type: string
        default: ''
      db_name:
        description: 'Output database file name'
        required: false
        type: string
        default: 'sales_monitoring.db'

permissions:
  contents: read  # No need to write to repo; only read

jobs:
  generate-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openai

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          DB_NAME="${{ github.event.inputs.db_name }}"

          # Build command
          CMD="python scripts/1_2.sales_generator.py"
          if [ -n "$TARGET_DATE" ]; then
            CMD="$CMD --date $TARGET_DATE"
          fi
          if [ -n "$DB_NAME" ]; then
            CMD="$CMD --db $DB_NAME"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-${{ github.run_id }}
          path: ${{ github.event.inputs.db_name || 'sales_monitoring.db' }}
          retention-days: 7
