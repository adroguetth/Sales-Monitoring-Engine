name: Sales Data Generator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        type: string
      force_refresh:
        description: 'Force re-run even if DB exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy openai

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          fi
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "db_file=data/sales/${TARGET_DATE}.db" >> $GITHUB_OUTPUT
          mkdir -p data/sales

      - name: Run sales generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/1_2.sales_generator.py \
            --date ${{ steps.date.outputs.target_date }} \
            --db ${{ steps.date.outputs.db_file }}

      - name: Verify database content
        run: |
          echo "Database file: ${{ steps.date.outputs.db_file }}"
          ls -la ${{ steps.date.outputs.db_file }}
          echo "Record count:"
          sqlite3 ${{ steps.date.outputs.db_file }} "SELECT COUNT(*) FROM sales_data;" || echo "Table not found or empty"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-${{ github.run_id }}
          path: ${{ steps.date.outputs.db_file }}
          retention-days: 30
